org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dhttp.socketTimeout=120000 -Dhttp.connectionTimeout=120000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental caches crash on Windows when the project (F:) and
# pub-cache (C:) are on different drives ("this and base files have different roots").
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
